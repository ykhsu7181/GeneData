[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "genedata-cli"
version = "0.1.0"
description = "Command-line client for the GeneData public file and batch APIs"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Proprietary"}
authors = [{name = "GeneData"}]
dependencies = []

[project.scripts]
genedata = "genedata_cli.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
