name: GeneData CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: genedata-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  django:
    name: Django checks and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: gene_manage_ci
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: django2
    env:
      DJANGO_SECRET_KEY: ci-only-secret-key-with-more-than-fifty-unique-characters-123456789
      GENEDATA_DB_NAME: gene_manage_ci
      GENEDATA_DB_USER: root
      GENEDATA_DB_PASSWORD: ci-root-password
      GENEDATA_DB_HOST: 127.0.0.1
      GENEDATA_DB_PORT: 3306
      GENEDATA_LOG_PATH: /tmp/genedata-ci.log
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: django2/requirements.txt

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run Django system check
        run: python manage.py check

      - name: Reject missing migrations
        run: python manage.py makemigrations --check --dry-run files

      - name: Run files test suite against isolated MySQL
        run: python manage.py test files --noinput

      - name: Run production deployment checks
        run: python manage.py check --deploy --fail-level ERROR --settings=filemanager.settings_production

  frontend:
    name: Frontend behavior and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: vue_project
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: vue_project/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend behavior tests
        run: npm test

      - name: Build production frontend
        run: npm run build
